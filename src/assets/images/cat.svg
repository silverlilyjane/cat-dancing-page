<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="80" r="35" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>

  <!-- Cat ears -->
  <polygon points="75,55 85,35 95,55" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  <polygon points="105,55 115,35 125,55" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>

  <!-- Inner ears -->
  <polygon points="78,52 83,40 88,52" fill="#FFB347"/>
  <polygon points="112,52 117,40 122,52" fill="#FFB347"/>

  <!-- Cat eyes -->
  <ellipse cx="88" cy="75" rx="6" ry="8" fill="#2C3E50"/>
  <ellipse cx="112" cy="75" rx="6" ry="8" fill="#2C3E50"/>

  <!-- Eye shine -->
  <ellipse cx="90" cy="73" rx="2" ry="3" fill="#FFFFFF"/>
  <ellipse cx="114" cy="73" rx="2" ry="3" fill="#FFFFFF"/>

  <!-- Cat nose -->
  <polygon points="100,85 95,90 105,90" fill="#E74C3C"/>

  <!-- Cat mouth -->
  <path d="M100,92 Q95,98 90,95" stroke="#2C3E50" stroke-width="2" fill="none"/>
  <path d="M100,92 Q105,98 110,95" stroke="#2C3E50" stroke-width="2" fill="none"/>

  <!-- Cat whiskers -->
  <line x1="65" y1="82" x2="85" y2="80" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="65" y1="88" x2="85" y2="88" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="115" y1="80" x2="135" y2="82" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="115" y1="88" x2="135" y2="88" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- Cat legs -->
  <ellipse cx="75" cy="165" rx="8" ry="20" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  <ellipse cx="95" cy="165" rx="8" ry="20" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  <ellipse cx="105" cy="165" rx="8" ry="20" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  <ellipse cx="125" cy="165" rx="8" ry="20" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>

  <!-- Cat paws -->
  <ellipse cx="75" cy="180" rx="10" ry="6" fill="#D35400"/>
  <ellipse cx="95" cy="180" rx="10" ry="6" fill="#D35400"/>
  <ellipse cx="105" cy="180" rx="10" ry="6" fill="#D35400"/>
  <ellipse cx="125" cy="180" rx="10" ry="6" fill="#D35400"/>

  <!-- Cat tail -->
  <path d="M145,130 Q165,120 175,105 Q185,90 180,75" stroke="#E67E22" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M145,130 Q165,120 175,105 Q185,90 180,75" stroke="#FF8C42" stroke-width="12" fill="none" stroke-linecap="round"/>
</svg>